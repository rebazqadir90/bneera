<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — Bneera</title>
<meta name="description" content="Manage your Bneera profile, saved addresses, orders, and password.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F7A6C'/%3E%3Ccircle cx='9' cy='23' r='2.4' fill='%23F3F1EA'/%3E%3Ccircle cx='23' cy='23' r='2.4' fill='%23F3F1EA'/%3E%3Cpath d='M5 23V11h13l6 6v6' stroke='%23F3F1EA' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EA;
  --bg-alt:#EAE6DA;
  --card:#FBFAF6;
  --ink:#1C1B17;
  --ink-soft:#5B584C;
  --ink-faint:#8A8574;
  --accent:#1F7A6C;
  --accent-strong:#145C51;
  --accent-ink:#F3F1EA;
  --logo-blue:#1D4ED8;
  --tag:#B5701A;
  --danger:#B3413A;
  --line:#D8D2C2;
  --line-strong:#C2BAA4;
  --shadow: 0 1px 2px rgba(28,27,23,0.06), 0 8px 24px -12px rgba(28,27,23,0.18);
  --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --font-body:'Public Sans', -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
}
:root[data-theme="dark"]{
  --bg:#12161A; --bg-alt:#181D22; --card:#161B20;
  --ink:#EDEAE0; --ink-soft:#A6ACAE; --ink-faint:#6E7578;
  --accent:#3AA894; --accent-strong:#5BC3AE; --accent-ink:#0B1210;
  --tag:#E8A33D; --danger:#E0776B;
  --line:#262D33; --line-strong:#333C43;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
img,svg{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
h1{font-family:var(--font-display);text-transform:uppercase;margin:0;font-size:clamp(28px,4vw,40px);font-weight:900;}
h2{font-family:var(--font-display);text-transform:uppercase;margin:0 0 18px;font-size:20px;font-weight:800;}
.container{max-width:1180px;margin:0 auto;padding:0 28px;}
.mono{font-family:var(--font-mono);}

.topbar{border-bottom:1px solid var(--line);background:var(--card);}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;}
.logo-img{height:34px;width:auto;display:block;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;border:1px solid transparent;
  color:var(--ink-soft);cursor:pointer;background:none;
  transition:background .15s ease,color .15s ease;
}
.icon-btn:hover{background:var(--bg-alt);color:var(--ink);}
.icon-btn svg{width:19px;height:19px;}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none;margin:0;padding:0;}
.nav-links a{text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-soft);transition:color .15s ease;}
.nav-links a:hover,.nav-links a.active{color:var(--ink);}
@media (max-width:920px){ .nav-links{display:none;} }

.page-head{padding:36px 0 22px;}

/* layout */
.account-layout{display:flex;gap:28px;align-items:flex-start;padding-bottom:60px;}
.account-sidebar{
  width:240px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:24px 18px;text-align:center;
}
.avatar-wrap{position:relative;width:88px;height:88px;margin:0 auto 14px;cursor:pointer;}
.avatar-img{
  width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:var(--accent-ink);
  font-family:var(--font-mono);font-size:28px;font-weight:700;
}
.avatar-edit{
  position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;
  background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;
  border:2px solid var(--card);
}
.avatar-edit svg{width:14px;height:14px;}
.account-name{font-weight:700;font-size:15px;margin:0 0 2px;}
.account-email{font-size:12.5px;color:var(--ink-faint);margin:0 0 20px;word-break:break-all;}
.sidebar-nav{display:flex;flex-direction:column;gap:4px;text-align:left;}
.sidebar-nav button{
  display:block;width:100%;text-align:left;background:none;border:none;border-radius:8px;
  padding:10px 12px;font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--ink-soft);cursor:pointer;
}
.sidebar-nav button:hover{background:var(--bg-alt);color:var(--ink);}
.sidebar-nav button.active{background:var(--accent);color:var(--accent-ink);}
.sidebar-foot{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;text-align:left;}
.sidebar-foot a{font-size:13px;color:var(--accent);}
.sidebar-foot a:hover{text-decoration:underline;}

.account-content{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px;}
.account-panel{display:none;}
.account-panel.active{display:block;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
.field input{
  font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;
}
.field input:focus{border-color:var(--accent);}
.field input[readonly]{color:var(--ink-faint);cursor:not-allowed;}
.field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){ .field-row-2{grid-template-columns:1fr;} .account-layout{flex-direction:column;} .account-sidebar{width:100%;} }

.btn-save{
  background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;
  padding:11px 22px;font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;
}
.btn-save:hover{background:var(--accent-strong);}
.btn-save:disabled{opacity:.6;cursor:wait;}
.form-note{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;display:none;}
.form-note.success{display:block;background:rgba(31,122,108,0.12);color:var(--accent-strong);}
.form-note.error{display:block;background:rgba(179,65,58,0.1);color:var(--danger);}

.order-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.order-row:last-child{border-bottom:none;}
.order-row-id{font-size:13.5px;font-weight:600;}
.order-row-meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.status-pill{
  display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:20px;background:var(--bg-alt);color:var(--ink-soft);
}
.order-row-link{font-size:13px;color:var(--accent);flex:none;}
.empty-state{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" aria-label="Bneera home"><img class="logo-img" src="BNEERA_logo_teal_final.png" alt="Bneera"></a>
    <ul class="nav-links">
      <li><a href="index.html#top">Home</a></li>
      <li><a href="orders.html">My Orders</a></li>
    </ul>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <a href="account.html" class="icon-btn" id="account-btn" aria-label="Account" title="Account" style="background:var(--bg-alt);color:var(--ink);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>
      <button type="button" class="icon-btn" id="logout-btn" aria-label="Log out" title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</div>

<main class="container">
  <div class="page-head">
    <h1>My Account</h1>
  </div>

  <div class="account-layout">
    <aside class="account-sidebar">
      <div class="avatar-wrap" id="avatar-wrap">
        <img class="avatar-img" id="avatar-img" style="display:none;" alt="Profile photo">
        <div class="avatar-img" id="avatar-fallback">?</div>
        <div class="avatar-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
        <input type="file" id="avatar-input" accept="image/*" hidden>
      </div>
      <p class="account-name" id="sidebar-name">—</p>
      <p class="account-email" id="sidebar-email">—</p>
      <nav class="sidebar-nav">
        <button type="button" class="active" data-panel="profile">Profile</button>
        <button type="button" data-panel="addresses">Addresses</button>
        <button type="button" data-panel="orders">Order List</button>
        <button type="button" data-panel="password">Change Password</button>
      </nav>
      <div class="sidebar-foot">
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </aside>

    <section class="account-content">
      <div class="account-panel active" id="panel-profile">
        <h2>Profile</h2>
        <div class="field"><label>Full name</label><input type="text" id="p-name" readonly></div>
        <div class="field"><label>Email</label><input type="text" id="p-email" readonly></div>
        <div class="field"><label>Member since</label><input type="text" id="p-joined" readonly></div>
      </div>

      <div class="account-panel" id="panel-addresses">
        <h2>Shipping Address</h2>
        <p class="form-note" id="addr-note"></p>
        <form id="addr-form" novalidate>
          <div class="field-row-2">
            <div class="field"><label for="a-first">First name</label><input type="text" id="a-first" required></div>
            <div class="field"><label for="a-last">Last name</label><input type="text" id="a-last" required></div>
          </div>
          <div class="field"><label for="a-address">Full address</label><input type="text" id="a-address" required></div>
          <div class="field"><label for="a-city">City</label><input type="text" id="a-city" required></div>
          <div class="field-row-2">
            <div class="field"><label for="a-phone">Phone number</label><input type="tel" id="a-phone" required></div>
            <div class="field"><label for="a-phone2">Second phone (optional)</label><input type="tel" id="a-phone2"></div>
          </div>
          <button type="submit" class="btn-save">Save address</button>
        </form>
      </div>

      <div class="account-panel" id="panel-orders">
        <h2>Order List</h2>
        <div id="orders-list"></div>
        <p class="empty-state" id="orders-empty" hidden>No orders yet.</p>
      </div>

      <div class="account-panel" id="panel-password">
        <h2>Change Password</h2>
        <p class="form-note" id="pw-note"></p>
        <form id="pw-form" novalidate>
          <div class="field"><label for="pw-current">Current password</label><input type="password" id="pw-current" autocomplete="current-password" required></div>
          <div class="field"><label for="pw-new">New password</label><input type="password" id="pw-new" autocomplete="new-password" minlength="8" required></div>
          <div class="field"><label for="pw-confirm">Confirm new password</label><input type="password" id="pw-confirm" autocomplete="new-password" required></div>
          <button type="submit" class="btn-save">Update password</button>
        </form>
      </div>
    </section>
  </div>
</main>

<script>
(function(){
  var STATUS_CLASS = {
    'Pending':'status-amber','Processed':'status-blue','Confirmed':'status-blue','Purchased':'status-blue',
    'Received':'status-accent','Shipped To Iraq':'status-accent','Arrived':'status-done','Delivered':'status-done','Canceled':'status-danger'
  };

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function formatPrice(n){
    var num = Number(n);
    if(isNaN(num)){ num = 0; }
    return '$' + num.toFixed(2);
  }

  /* sidebar nav switching */
  var navButtons = document.querySelectorAll('.sidebar-nav button');
  var panels = document.querySelectorAll('.account-panel');
  navButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      navButtons.forEach(function(b){ b.classList.remove('active'); });
      panels.forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.getAttribute('data-panel')).classList.add('active');
      if(btn.getAttribute('data-panel') === 'orders'){ loadOrders(); }
    });
  });

  /* theme toggle */
  var themeBtn = document.getElementById('theme-toggle-btn');
  var savedTheme = 'light';
  try{ savedTheme = localStorage.getItem('bneera-theme') || 'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeBtn.addEventListener('click', function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('bneera-theme', next); }catch(e){}
  });

  document.getElementById('logout-btn').addEventListener('click', function(){
    fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).then(function(){
      window.location.href = 'index.html';
    });
  });

  /* avatar */
  var avatarImg = document.getElementById('avatar-img');
  var avatarFallback = document.getElementById('avatar-fallback');
  var avatarInput = document.getElementById('avatar-input');
  document.getElementById('avatar-wrap').addEventListener('click', function(){ avatarInput.click(); });
  avatarInput.addEventListener('change', function(){
    var file = avatarInput.files && avatarInput.files[0];
    if(!file){ return; }
    var formData = new FormData();
    formData.append('avatar', file);
    fetch('/api/me/avatar', { method: 'POST', credentials: 'same-origin', body: formData })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        if(!result.ok){
          alert((result.data.error && result.data.error.message) || 'Failed to upload photo.');
          return;
        }
        applyUser(result.data.user);
      })
      .catch(function(){ alert('Network error — try again.'); });
  });

  function applyUser(user){
    document.getElementById('sidebar-name').textContent = user.fullName;
    document.getElementById('sidebar-email').textContent = user.email;
    document.getElementById('p-name').value = user.fullName;
    document.getElementById('p-email').value = user.email;
    if(user.avatar){
      avatarImg.src = user.avatar;
      avatarImg.style.display = 'block';
      avatarFallback.style.display = 'none';
    } else {
      avatarImg.style.display = 'none';
      avatarFallback.style.display = 'flex';
      avatarFallback.textContent = (user.fullName || '?').trim().charAt(0).toUpperCase();
    }
  }

  /* addresses */
  var addrForm = document.getElementById('addr-form');
  var addrNote = document.getElementById('addr-note');
  function loadAddress(){
    fetch('/api/me/shipping', { credentials: 'same-origin' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        var s = data.shipping;
        if(!s){ return; }
        document.getElementById('a-first').value = s.firstName;
        document.getElementById('a-last').value = s.lastName;
        document.getElementById('a-address').value = s.address;
        document.getElementById('a-city').value = s.city;
        document.getElementById('a-phone').value = s.phone;
        document.getElementById('a-phone2').value = s.phone2 || '';
      });
  }
  addrForm.addEventListener('submit', function(e){
    e.preventDefault();
    addrNote.className = 'form-note';
    var btn = addrForm.querySelector('.btn-save');
    btn.disabled = true;
    fetch('/api/me/shipping', {
      method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        firstName: document.getElementById('a-first').value.trim(),
        lastName: document.getElementById('a-last').value.trim(),
        address: document.getElementById('a-address').value.trim(),
        city: document.getElementById('a-city').value.trim(),
        phone: document.getElementById('a-phone').value.trim(),
        phone2: document.getElementById('a-phone2').value.trim()
      })
    }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        btn.disabled = false;
        if(!result.ok){
          addrNote.textContent = (result.data.error && result.data.error.message) || 'Failed to save address.';
          addrNote.className = 'form-note error';
          return;
        }
        addrNote.textContent = 'Address saved.';
        addrNote.className = 'form-note success';
      }).catch(function(){
        btn.disabled = false;
        addrNote.textContent = 'Network error — try again.';
        addrNote.className = 'form-note error';
      });
  });

  /* orders */
  var ordersLoaded = false;
  function loadOrders(){
    if(ordersLoaded){ return; }
    ordersLoaded = true;
    fetch('/api/orders', { credentials: 'same-origin' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        var orders = data.orders || [];
        var list = document.getElementById('orders-list');
        var empty = document.getElementById('orders-empty');
        if(orders.length === 0){
          list.innerHTML = '';
          empty.hidden = false;
          return;
        }
        empty.hidden = true;
        list.innerHTML = orders.map(function(o){
          var price = Number(o.price) || 0;
          var qty = Number(o.quantity) || 1;
          var tax = Number(o.tax) || 0;
          var shipping = Number(o.shipping) || 0;
          var total = price * qty + tax + shipping;
          return '<div class="order-row">' +
            '<div>' +
              '<div class="order-row-id mono">#' + escapeHtml(o.id) + '</div>' +
              '<div class="order-row-meta">' + escapeHtml(o.day || '') + ' · Qty ' + qty + ' · ' + formatPrice(total) + '</div>' +
            '</div>' +
            '<span class="status-pill">' + escapeHtml(o.status) + '</span>' +
          '</div>';
        }).join('');
      });
  }

  /* change password */
  var pwForm = document.getElementById('pw-form');
  var pwNote = document.getElementById('pw-note');
  pwForm.addEventListener('submit', function(e){
    e.preventDefault();
    pwNote.className = 'form-note';
    var newPw = document.getElementById('pw-new').value;
    var confirmPw = document.getElementById('pw-confirm').value;
    if(newPw !== confirmPw){
      pwNote.textContent = "New passwords don't match.";
      pwNote.className = 'form-note error';
      return;
    }
    var btn = pwForm.querySelector('.btn-save');
    btn.disabled = true;
    fetch('/api/me/change-password', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        currentPassword: document.getElementById('pw-current').value,
        newPassword: newPw,
        confirmNewPassword: confirmPw
      })
    }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        btn.disabled = false;
        if(!result.ok){
          pwNote.textContent = (result.data.error && result.data.error.message) || 'Failed to update password.';
          pwNote.className = 'form-note error';
          return;
        }
        pwForm.reset();
        pwNote.textContent = 'Password updated. You\'ve been signed out of all other devices.';
        pwNote.className = 'form-note success';
      }).catch(function(){
        btn.disabled = false;
        pwNote.textContent = 'Network error — try again.';
        pwNote.className = 'form-note error';
      });
  });

  /* auth guard */
  fetch('/api/me', { credentials: 'same-origin' })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(!data.user){
        window.location.href = 'login.html';
        return;
      }
      applyUser(data.user);
      document.getElementById('p-joined').value = new Date(data.user.createdAt || Date.now()).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
      loadAddress();
    });
})();
</script>
<script src="analytics.js" defer></script>
</body>
</html>
